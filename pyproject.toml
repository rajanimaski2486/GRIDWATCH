[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "hackathon_nyc"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
description = "GridWatch - NYC urban intelligence and dispatch, built on NVIDIA NeMo Agent Toolkit"
keywords = ["ai", "rag", "agents", "nyc", "floodwatch", "311", "nemo-agent-toolkit"]
classifiers = ["Programming Language :: Python"]

dependencies = [
  # NAT runtime. [langchain] supplies the react/tool_calling/reasoning agents
  # and the NIM LLM client used by config_gridwatch.yml.
  "nvidia-nat[langchain]>=1.8,<2.0",
  # Web layer
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "aiohttp>=3.9.0",
  "pydantic>=2.0.0",
  # RAG store. NAT 1.8 ships only milvus/nemo retriever providers, so
  # retrievers/opensearch.py registers an opensearch_retriever of our own.
  "opensearch-py>=2.4.0",
]

[project.optional-dependencies]
# Observability + evaluation. Installed in dev and in the deployed image.
observability = [
  "nvidia-nat[phoenix,profiler]>=1.8,<2.0",
]
eval = [
  "nvidia-nat[ragas,profiler]>=1.8,<2.0",
]
# Citizen intake channels. Optional so the core workflow can run without them.
channels = [
  "twilio>=9.0.0",
  "discord.py>=2.3.0",
]
# Persist incidents outside the container. Required on hosts with an ephemeral
# filesystem — set DATABASE_URL to a libSQL/Turso URL. See db.py.
remote-db = [
  "libsql-experimental>=0.0.40",
]

# This entry point is how `nat` discovers nyc_flood_tools, nyc_311_tools,
# nyc_geo_tools, nyc_crm_tools and parallel_agent_query. Do not remove it.
[project.entry-points.'nat.components']
hackathon_nyc = "hackathon_nyc.register"
